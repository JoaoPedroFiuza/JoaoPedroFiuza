name: Generate Snake

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite executar manualmente a qualquer momento pela aba Actions
  workflow_dispatch:

# Garante permissão para commitar na branch do repositório
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera o jogo da cobrinha a partir do gráfico de contribuições do usuário
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: JoaoPedroFiuza
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Envia os arquivos gerados no diretório dist para a branch 'output'
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
